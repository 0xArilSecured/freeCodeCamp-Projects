<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Selection Feature Page</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="title">Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card" for="cloud-storage">
            <input 
                type="checkbox" 
                id="cloud-storage" 
                name="feature"
                value="cloud-storage">
            <h2>Cloud Storage</h2>
            <p>100 Gigabyte secure storage</p>
        </label>
        <label class="feature-card" for="dedicated-support">
            <input 
                type="checkbox" 
                id="dedicated-support"
                name="feature" 
                value="dedicated-support">
            <h2>Dedicated Support</h2>
            <p>24/7 customer help</p>
        </label>
        <label class="feature-card" for="advanced-analytics">
            <input 
                type="checkbox" 
                id="advanced-analytics" 
                name="feature"
                value="advanced-analytics">
            <h2>Advanced Analytics</h2>
            <p>Insights & reports</p>
        </label>
        <label class="feature-card" for="custom-user-themes">
            <input 
                type="checkbox" 
                id="custom-user-themes"
                name="feature" 
                value="custom-user-themes">
            <h2>Custom User Themes</h2>
            <p>Personalized dashboard design</p>
        </label>
        <label class="feature-card" for="multi-user-collab">
            <input 
                type="checkbox" 
                id="multi-user-collab"
                name="feature" 
                value="multi-user-collab">
            <h2>Multi-User Collab</h2>
            <p>Team access and sharing</p>
        </label>
        <label class="feature-card" for="api-access">
            <input 
                type="checkbox" 
                id="api-access" 
                name="feature"
                value="api-access">
            <h2>API Access</h2>
            <p>Integrate with your custom built tools</p>
        </label>
    </div>
</body>

</html>
