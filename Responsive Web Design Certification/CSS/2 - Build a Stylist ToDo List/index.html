<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" >
    <meta name="viewport" content="width: device-width; initial-scale: 1.0" > 
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1 class="title">My To-Do List</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="gaming-keyboard" value="gaming-keyboard">
                <label for="gaming-keyboard">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://example.com" class="sub-item-link" target="_blank">Store link</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="finished-report" value="finished-report">
                <label for="finished-report">Finish the report</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://example.com" class="sub-item-link" target="_blank">Request access</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="phone-warranty" value="phone-warranty">
                <label for="phone-warranty">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://example.com" class="sub-item-link" target="_blank">View Receipts</a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="processor-specs" value="processor-specs">
                <label for="processor-specs">Check Processor Specs</label>
                <ul class="sub-item">
                    <li>
                        <a href="https://example.com" class="sub-item-link" target="_blank">View Model Number</a>
                    </li>
                </ul>
            </li>
        </ul>
    </main>
</body>

</html>
